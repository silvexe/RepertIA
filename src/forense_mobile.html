<!-- RepertIA 2.20 - parte smartphone dell'interfaccia: inserita da forense_gui.py al posto del segnaposto REPERTIA_MOBILE.
     Usa le funzioni della pagina principale (api, T, TF, esc, fts, toast, show, startPrepView, pollPrep, openCase, pvOpen,
     locate…). Se manca (pacchetto «solo dischi»), il bottone Smartphone lo dice. -->
<style>

.porig{margin:8px 12px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel2);font-size:13px}

.chatwin>*{min-width:0}
.thlist{overflow:auto;flex:1}

.th:hover{background:var(--panel2)}
.th.on{background:var(--accent-soft)}

.th .t .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatright{display:flex;flex-direction:column;min-height:0}
.chtop{flex:none;display:flex;flex-direction:column;min-height:0}.chatleft .flt{flex:none}
.chatright .cinfo{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chatright .cinfo b{color:var(--ink);font-size:15px}
.chatright .flt{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.chatright .flt input{width:auto;flex:1;min-width:120px}

.bub.in{align-self:flex-start;border-top-left-radius:3px}

.kcstate .hint{overflow-wrap:anywhere}.kcbox{margin:2px 0 14px}.kcrow{display:flex;gap:8px;align-items:center}.kcrow .pathin{flex:1;margin:4px 0}
.att{margin-top:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12.5px;white-space:normal}

.bub .meta .act{text-decoration:none;opacity:.75}

.attwin{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 40px rgba(0,0,0,.35);width:min(1200px,100%);display:flex;flex-direction:column;overflow:hidden}
.atthead{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}

.attslot{flex:1;min-height:0;display:flex}
.attslot>.pv{flex:1;width:auto!important;max-width:none;border-left:none;display:flex}
.avalt{padding:16px;overflow:auto;flex:1}
.avalt video,.avalt audio{max-width:100%}
.th .orig{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 6px}
.cinfo .crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cinfo .crow .btn{padding:2px 8px;font-size:12px}
.att img{cursor:zoom-in}
.chathead .navslot:empty{display:none}
.artkv{font-size:12.5px;line-height:1.4}
.artkv>div{margin:0 0 2px}
.artkv .k{font-size:11px;color:var(--muted);margin-right:5px}
.artkv .v{overflow-wrap:normal;word-break:normal}
.artkv .lt{overflow-wrap:anywhere}
@media (max-width:760px){.chatov{padding:6px}.chatwin{grid-template-columns:1fr;grid-template-rows:auto minmax(0,40%) 1fr}.chatwin>.psplit{display:none}.chatleft{border-right:none;border-bottom:1px solid var(--line)}.bub{max-width:92%}}
</style>
<script>
(() => {
  // ------------------------------------------------------------------ pagina iniziale: estrazione del telefono
  const card = document.createElement("div");
  card.className = "card hidden mobform"; card.id = "homePhone";
  card.innerHTML = `
    <button class="btn small homeback" id="mobBack">${T("← Indietro")}</button>
    <h1>${T("Nuova analisi di uno smartphone")}</h1>
    <p class="lead">${T("Scegli l'estrazione del file system completo del telefono (iPhone o Android): zip o tar dello strumento di acquisizione, oppure la cartella già estratta.")}</p>
    <div class="row2"><button class="btn primary big" id="mobPickFile">${T("Scegli il file dell'estrazione…")}</button><button class="btn big" id="mobPickDir">${T("Scegli una cartella…")}</button></div>
    <input class="pathin" id="mobPath" placeholder="${esc(T("…oppure incolla qui il percorso, es. /Volumes/Reperti/iPhone_FFS.zip"))}">
    <div class="hint">${T("Formati: zip (Cellebrite FFS, GrayKey, altri), tar, tar.gz, cartella. Le estrazioni XRY si aprono se esportate come file system. Un report UFDR non è un'estrazione del file system: arriverà in una versione successiva.")}</div>
    <div id="mobInfo" class="imginfo hidden"></div>
    <label class="opt"><input type="checkbox" id="mobHash" checked><span>${T("Calcola subito lo SHA-256 dell'estrazione")}<small>${T("Consigliato. Toglilo per un'analisi speditiva: l'hash si calcola dopo, dal caso.")}</small></span></label>
    <label class="opt"><input type="checkbox" id="mobLeapp" checked><span>${T("Artefatti con iLEAPP (iPhone) o ALEAPP (Android)")}<small>${T("Centinaia di artefatti delle app (posizioni, chiamate, browser, account…), con i programmi open source di Alexis Brignoni inclusi in RepertIA. Può durare a lungo sulle estrazioni grandi.")}</small></span></label>
    <div class="kcbox"><label class="flab" for="mobKc">🔑 ${T("Portachiavi (keychain) – file acquisito a parte, es. GrayKey")} <span class="hint">${T("facoltativo, solo iPhone")}</span></label>
      <div class="kcrow"><input class="pathin" id="mobKc" placeholder="${esc(T("percorso del file del portachiavi (plist)"))}"><button class="btn" id="mobKcPick">${T("Scegli…")}</button></div>
      <div class="hint">${T("Non viene copiato nel caso: se ne calcola lo SHA-256 (nel registro) e si passa a iLEAPP, che lo usa per decifrare i dati di alcune app (Signal, Session, SimpleX…). Senza, iLEAPP usa quello eventualmente presente nell'estrazione (es. extra/KeychainDump di Cellebrite).")}</div></div>
    <div class="kcbox"><label class="flab" for="mobSd">🩺 ${T("Sysdiagnose (.tar.gz)")} <span class="hint">${T("facoltativo, solo iPhone, anche più di uno")}</span></label>
      <div id="mobSdList"></div>
      <div class="kcrow"><input class="pathin" id="mobSd" placeholder="${esc(T("percorso del file sysdiagnose_….tar.gz"))}"><button class="btn" id="mobSdAdd">${T("Aggiungi")}</button><button class="btn" id="mobSdPick">${T("Scegli…")}</button></div>
      <div class="hint">${T("Non viene copiato nel caso: se ne calcola lo SHA-256 (nel registro) e iLEAPP lo legge con un secondo giro (processi, spegnimenti, Wi-Fi, Bluetooth, batteria, impostazioni…). Le righe vanno negli Artefatti, gruppo «Sysdiagnose», marcate con il nome del file.")}</div></div>
    <label class="opt"><input type="checkbox" id="mobWaBackup"><span>${T("Decifra i backup di WhatsApp (Android), se nell'estrazione c'è la chiave")}<small>${T("I backup .crypt14 sono copie dei giorni precedenti: possono contenere messaggi poi cancellati. Si decifrano con la chiave del telefono (com.whatsapp/files/key) in una copia nel caso; l'estrazione non viene toccata.")}</small></span></label>
    <label class="opt"><input type="checkbox" id="mobHashFile"><span>${T("Calcola gli hash di tutti i file (MD5, SHA-1, SHA-256)")}<small>${T("Serve per cercare file noti con una lista di hash. Si può fare anche dopo, dal caso.")}</small></span></label>
    <div class="hint" style="margin:-6px 0 14px">${T("Chat (WhatsApp, iMessage/SMS, SMS/MMS), rubriche, testo dei documenti e metadati delle foto vengono letti sempre, in automatico.")}</div>
    <button class="btn primary" id="mobStart" disabled>${T("Avanti")}</button>`;
  const disk = document.getElementById("homeDisk");
  disk.parentNode.insertBefore(card, disk.nextSibling);
  // (2.20) casella «Trascrivi gli audio» (definita in forense_gui.html: si aggiunge quando tutta la pagina è caricata)
  setTimeout(() => trascrOpt($("mobHashFile").closest("label"), "mobTrascr", "chat"), 0);
  let cur = null, tP;
  const info = $("mobInfo");
  async function check(p){
    cur = null; $("mobStart").disabled = true;
    if (!p){ info.classList.add("hidden"); return; }
    try{
      const i = await api("/api/mobile/check", {path: p});
      info.classList.remove("hidden");
      if (!i.ok){ info.className = "imginfo err"; info.textContent = i.error; return; }
      cur = i; info.className = "imginfo";
      const fmt = {zip: "zip", tar: "tar", targz: "tar.gz", cartella: T("cartella")}[i.formato] || i.formato;
      info.innerHTML = `<b>${esc(base(i.path))}</b> · ${esc(fmt)}` + (i.size != null ? " · " + gb(i.size) : "") +
        `<br><span class="hint">${i.case_exists ? T("Esiste già un caso per questa estrazione: verrà riaperto.") : T("Il caso verrà creato in ") + esc(i.case_root)}</span>` +
        (i.decomprimere ? `<div class="note" style="margin-top:8px">${TF("È un tar compresso: per leggerne i file RepertIA crea nella cartella del caso una copia derivata decompressa, con SHA-256 e riferimento all'originale (che non viene modificato). Serve circa lo spazio dei dati decompressi (di solito 1,5-3 volte {0}); spazio libero: {1}.", gb(i.size || 0), i.free != null ? gb(i.free) : "?")}</div>` : "") +
        (i.formato === "cartella" ? `<div class="note" style="margin-top:8px">${T("Cartella già estratta: le date dei file sono quelle del computer su cui è stata copiata e possono non essere quelle del telefono (il caso lo dichiara). Se c'è, preferisci lo zip o il tar originale.")}</div>` : "");
      $("mobStart").disabled = false;
      $("mobStart").textContent = i.case_exists ? T("Apri il caso") : T("Avanti");
    }catch(e){ info.className = "imginfo err"; info.classList.remove("hidden"); info.textContent = e.message; }
  }
  $("mobBack").onclick = () => homeKind();
  $("mobPath").oninput = () => { clearTimeout(tP); tP = setTimeout(() => check($("mobPath").value), 350); };
  $("mobPickFile").onclick = async () => { try{ const r = await api("/api/mobile/choose", {}); if (r.path){ $("mobPath").value = r.path; check(r.path); } }catch(e){ toast(e.message, "bad"); } };
  // (2.20) sysdiagnose acquisiti a parte: elenco nel modulo, controllati subito dal server (archivio, data, dispositivo)
  const SD = [];
  const sdDraw = () => { $("mobSdList").innerHTML = SD.map((x, i) => `<div class="kcstate hint">🩺 <b>${esc(base(x.path))}</b>${x.creato_utc ? " · " + esc(TF("creato {0}", fts(x.creato_utc))) : ""}${x.dispositivo_testo ? " · " + esc(x.dispositivo_testo) : ""} <button class="btn small" data-sdx="${i}" title="${esc(T("Togli dall'elenco"))}">✕</button></div>`).join("");
    $("mobSdList").querySelectorAll("[data-sdx]").forEach(b => b.onclick = () => { SD.splice(+b.dataset.sdx, 1); sdDraw(); }); };
  const sdAdd = async p => {
    p = (p || "").trim(); if (!p) return true;
    if (SD.some(x => x.path === p)){ $("mobSd").value = ""; return true; }
    try{ const r = await api("/api/mobile/sysdiagnose_check", {path: p}); SD.push({...r, path: r.path || p}); $("mobSd").value = ""; sdDraw(); return true; }
    catch(e){ toast(e.message, "bad"); return false; }
  };
  $("mobSdAdd").onclick = () => sdAdd($("mobSd").value);
  $("mobSd").onkeydown = e => { if (e.key === "Enter") sdAdd($("mobSd").value); };
  $("mobSdPick").onclick = async () => { try{ const r = await api("/api/mobile/choose_sysdiagnose", {}); if (r.path) sdAdd(r.path); }catch(e){ toast(e.message, "bad"); } };
  $("mobKcPick").onclick = async () => { try{ const r = await api("/api/mobile/choose_keychain", {}); if (r.path) $("mobKc").value = r.path; }catch(e){ toast(e.message, "bad"); } };
  $("mobPickDir").onclick = async () => { try{ const r = await api("/api/mobile/choose", {folder: true}); if (r.path){ $("mobPath").value = r.path; check(r.path); } }catch(e){ toast(e.message, "bad"); } };
  let mobOpts = null;
  $("mobStart").onclick = async () => {
    if (!cur) return;
    if (!(await sdAdd($("mobSd").value))) return;
    mobOpts = {no_hash: !$("mobHash").checked, leapp: $("mobLeapp").checked, hash_file: $("mobHashFile").checked, wa_backup: $("mobWaBackup").checked, decomprimi: !!cur.decomprimere,
               keychain: $("mobKc").value.trim() || undefined, sysdiagnose: SD.length ? SD.map(x => x.path) : undefined,
               trascrizione: await trascrOptRead("mobTrascr")};      // (2.20) consenso al modello prima di avviare
    if (mobOpts.keychain && !mobOpts.leapp) return toast(T("Il portachiavi serve a iLEAPP: spunta anche «Artefatti con iLEAPP»."), "bad");
    if (cur.case_exists){ try{ const r = await api("/api/mobile/prepare", {path: cur.path, ...mobOpts}); return openCase(r.root); }catch(e){ return toast(e.message, "bad"); } }
    // stessa pagina dei dati del caso dei dischi, in modalità smartphone
    RM.mode = true;
    $("newImg").textContent = cur.path;
    $("niNome").value = base(cur.path).replace(/\.(zip|tar|tgz|tar\.gz)$/i, "");
    $("niOper").value = store.get("repertia_operatore", "") || "";
    $("niReperto").value = T("Telefono / tablet"); $("niNote").value = ""; $("niFusoSel").value = ""; $("niFuso").value = ""; $("niFuso").classList.add("hidden");
    $("niLingua").value = LG.lingua || "it";
    $("niDest").value = (homeInfo && homeInfo.last_dest) || (homeInfo && homeInfo.homes && homeInfo.homes[0] && homeInfo.homes[0].path) || "";
    show("vNew"); $("niNome").focus(); $("niNome").select();
  };
  const goDisk = $("niGo").onclick, backDisk = $("niBack").onclick;
  $("niBack").onclick = e => { if (RM.mode){ RM.mode = false; show("vHome"); return; } return backDisk(e); };
  $("btnStart").addEventListener("click", () => { RM.mode = false; }, true);
  $("niGo").onclick = async e => {
    if (!RM.mode) return goDisk(e);
    if (!cur || !mobOpts) return;
    const inf = {nome: $("niNome").value, operatore: $("niOper").value, reperto: $("niReperto").value, note: $("niNote").value};
    if ($("niOper").value.trim()) store.set("repertia_operatore", $("niOper").value.trim());
    const fs0 = $("niFusoSel").value, fuso = fs0 === "altro" ? $("niFuso").value.trim() : fs0;
    if (fs0 === "altro" && !fuso) return toast(T("Indica il fuso orario (es. America/New_York) oppure scegli «Automatico»."), "bad");
    $("niGo").disabled = true;
    try{
      const r = await api("/api/mobile/prepare", {path: cur.path, ...mobOpts, info: inf, fuso, lingua: $("niLingua").value || LG.lingua || "it", dest: $("niDest").value.trim() || undefined});
      RM.mode = false;
      if (r.existing) return openCase(r.root);
      startPrepView(cur.path, {}); prepSteps = MSTEPS.filter(s => (s[0] !== "hash" || !mobOpts.no_hash) && (s[0] !== "decomp" || mobOpts.decomprimi) &&
        (s[0] !== "leapp" || mobOpts.leapp) && (s[0] !== "hashfile" || mobOpts.hash_file) && (s[0] !== "sysdiag" || (mobOpts.sysdiagnose || []).length) && (s[0] !== "trascr" || mobOpts.trascrizione)); curStep = -1; drawSteps(-1, null); pollPrep();
    }catch(err){ toast(err.message, "bad"); }
    finally{ $("niGo").disabled = false; }
  };
  // passi della preparazione (righe in italiano o in inglese, secondo la lingua del caso)
  const MSTEPS = [
    ["hash", T("Calcolo SHA-256 dell'estrazione"), /^\s*hash \d+%|SHA-256 della copia|SHA-256 of the/i],
    ["decomp", T("Copia derivata decompressa"), /Decompressione|decompressi|Decompressing|decompressed/i],
    ["list", T("Elenco dei file dell'estrazione"), /Elenco dei file dell'estrazione|voci dell'estrazione|extraction entries|Listing the files/i],
    ["chat", T("Chat e rubriche"), /^Rubriche e contatti|^Chat:|^Address books|^Chats:/],
    ["indice", T("Testo dei documenti e metadati"), /Indicizzazione|Documenti con testo|Indexing|Documents with text/],
    ["hashfile", T("Hash di tutti i file (MD5, SHA-1, SHA-256)"), /Hash dei file|Hash calcolati|File hashes|Hashes computed/],
    ["leapp", T("Artefatti con iLEAPP/ALEAPP"), /^(?!.*sysdiagnose).*(iLEAPP|ALEAPP)/i],
    ["sysdiag", T("Sysdiagnose con iLEAPP"), /lettura del sysdiagnose|reading the sysdiagnose|^Sysdiagnose .+: (verifica dello SHA-256|checking the SHA-256)/i],
    ["trascr", T("Trascrizione degli audio"), /^(Trascrizione|Transcription)/],
  ];

  // ------------------------------------------------------------------ caso aperto
  function caseRendered(c){
    ART_LBL.messaggi = c.tipo_caso === "smartphone" ? T("Messaggi delle chat") : MSG_DISK;
    // menu «Categoria» del filtro degli Artefatti: sui telefoni le categorie dei telefoni (anche nelle sottovoci)
    FILTERS.art[0][3] = c.tipo_caso === "smartphone"
      ? [["", T("Tutte")], ["messaggi", ART_LBL.messaggi], ["chiamate", ART_LBL.chiamate], ["leapp", ART_LBL.leapp]] : ART_CAT_DISK;
    FILTERS.meta = c.tipo_caso === "smartphone" ? metaFlt(Object.keys((c.chat || {}).app || {})) : META_FLT_DISK;
    let box = $("mobBox");
    if (c.tipo_caso !== "smartphone"){ if (box) box.remove(); return; }
    if (!box){ box = document.createElement("div"); box.id = "mobBox"; box.className = "mobbox"; $("caseParts").insertAdjacentElement("afterend", box); }
    const ch = c.chat || {}, apps = ch.app || {}, lp = c.leapp, mob = c.mobile || {};
    const nmsg = Object.values(apps).reduce((a, x) => a + x.messaggi, 0), nth = Object.values(apps).reduce((a, x) => a + x.conversazioni, 0);

  // (2.20) avvisi dell'importazione delle chat in una finestra ridimensionabile: un avviso per blocco, i percorsi uno per riga
  function avvisiDialog(av){
    const item = w => {
      const mm = /: (?=[^,\s]*\/)/.exec(w), i = mm ? mm.index : w.indexOf(": "), head = i > 0 ? w.slice(0, i + 1) : "", rest = i > 0 ? w.slice(i + 2) : w;

    openModal(TF("Avvisi dell'importazione ({0})", av.length), `<div class="avvl">${av.map(item).join("")}</div>`);

    card.classList.add("rsz");
    const off = () => { card.classList.remove("rsz"); $("modalClose").removeEventListener("click", off); };
    $("modalClose").addEventListener("click", off);
    $("modal").addEventListener("click", e => { if (e.target === $("modal")) off(); }, {once: true});
  }

  // ------------------------------------------------------------------ vista chat
  const APP = {whatsapp: "WhatsApp", imessage: "iMessage/SMS", sms: "SMS/MMS", whatsapp_backup: T("WhatsApp (backup decifrato)")};
  const ICO = {whatsapp: "🟢", imessage: "🔵", sms: "✉️", whatsapp_backup: "🗄"};
  const appLbl = k => APP[k] || k;
  const KIND = {testo: "", allegato: T("allegato"), sistema: T("evento"), reazione: T("reazione"), eliminato: T("messaggio eliminato (segnaposto dell'app: il testo non c'è più)"),
    posizione: T("posizione"), contatto: T("contatto"), link: T("link"), sondaggio: T("sondaggio"), chiamata: T("chiamata"), "non gestito": T("tipo non gestito")};
  // tipi WhatsApp classificati da forense_mobile_wa (extra.codice = valore del database): l'etichetta del tipo
  // («immagine», «tipo 27 non gestito»…) al posto del genere; senza codice (casi analizzati prima) come prima
  // stati di consegna e lettura (forense_mobile_ricevute): ✓ inviato, ✓✓ consegnato, ✓✓ blu letto, ▶ riprodotto
  const RC_LIV = {inviato: 1, consegnato: 2, letto: 3, riprodotto: 4};
  function rcIcon(rc){
    if (!rc || !rc.length) return "";
    const lv = Math.max(0, ...rc.map(x => RC_LIV[x.stato] || 0));
    const best = rc.filter(x => (RC_LIV[x.stato] || 0) === lv);
    const nv = lv && !best.some(x => x.verificato);
    const ico = lv >= 4 ? "✓✓▶" : lv === 3 ? "✓✓" : lv === 2 ? "✓✓" : lv === 1 ? "✓" : "ⓘ";
    const tip = rc.map(x => x.etichetta + (x.ts ? " " + fts(x.ts) : "") + (x.destinatario ? " · " + x.destinatario : "") + " — " + x.fonte + (x.verificato ? "" : " (" + T("non verificato") + ")")).join("\n") + (rcIos(rc) ? "\n\n" + RC_IOS : "");
    return `<a class="rcpt${lv >= 3 ? " read" : ""}${nv ? " nv" : ""}" data-rc="1" title="${esc(tip)}">${ico}</a>`;
  }
  // (2.20) WhatsApp iPhone: ZMESSAGESTATUS = 8 su tutti i messaggi; dove sia registrata la lettura dei messaggi inviati
  // non è verificato (forense_mobile_ricevute): la spunta grigia non è un «non letto»
  const RC_IOS = T("Su iPhone lo stato di lettura dei messaggi inviati non è leggibile in questa versione: la spunta grigia non indica che il messaggio non è stato letto.");
  const rcIos = rc => (rc || []).some(x => /^ZWAMESSAGE\.ZMESSAGESTATUS/.test(x.fonte || ""));
  function rcDialog(m){
    const rows = m.rc.map(x => `<tr><td>${esc(x.etichetta)}</td><td style="white-space:nowrap">${esc(x.ts ? fts(x.ts) : "—")}</td><td>${esc(x.destinatario || "")}</td><td class="mono">${esc(x.fonte)}</td><td>${x.verificato ? T("sì") : T("no")}</td><td>${esc(x.nota || "")}</td></tr>`).join("");
    openModal(T("Stato di consegna e lettura"), `<table class="restable" style="width:100%"><thead><tr><th>${T("Stato")}</th><th>${T("Data")}</th><th>${T("Destinatario")}</th><th>${T("Fonte")}</th><th>${T("Verificato")}</th><th>${T("Nota")}</th></tr></thead><tbody>${rows}</tbody></table>
      ${rcIos(m.rc) ? `<p class="note">${esc(RC_IOS)}</p>` : ""}<p class="hint">${T("L'assenza di «letto» non prova che il messaggio non sia stato letto: le conferme di lettura possono essere disattivate. Per i messaggi ricevuti non si mostrano stati.")}</p>`, [[T("Chiudi"), async () => $("modal").classList.add("hidden")]]);
  }
  const kindLbl = (kind, ex) => ex && ex.codice != null && kind !== "testo" && kind !== "eliminato" ? (ex.tipo || "") : (KIND[kind] || (kind && kind !== "testo" ? kind : ""));
  const IMG_RX = /\.(jpe?g|png|gif|heic|heif|webp|bmp|tiff?)$/i, VID_RX = /\.(mp4|mov|m4v|3gp|webm)$/i, AUD_RX = /\.(m4a|mp3|aac|amr|opus|ogg|wav|caf)$/i;
  const leappTool = () => (((caseInfo || {}).leapp || {}).strumento) || "iLEAPP/ALEAPP";
  function msgLabel(m, t){
    const who = m.dir === "out" ? T("inviato da questo dispositivo") : (m.sender_name || m.sender || T("ricevuto"));
    return TF("{0} · conversazione «{1}» · {2} · {3} UTC: «{4}» — {5}, tabella {6} riga {7}, messaggio {8}", appLbl(m.app), t.title, who,
      (m.ts || "").replace("T", " "), (m.text || "[" + (KIND[m.kind] || m.kind || "") + "]").slice(0, 300), m.src_path, m.src_table, m.src_row, m.id);
  }
  function threadLabel(t){

  }
  let ov = null, CS = {th: null, q: "", who: "", from: "", to: "", att: false, offset: 0, total: 0, threads: []};
  function closeChats(){ attClose(true); if (ov) ov.classList.add("hidden"); document.body.classList.remove("chatopen"); if (window.NAVR) NAVR(); }

  async function openChats(opts){

        <div class="psplit" id="chSplit" title="${esc(T("Trascina per allargare o stringere l'elenco delle conversazioni; doppio clic: larghezza predefinita"))}"></div>
        <div class="chatright"><div class="chtop" id="chTop"><div class="cinfo" id="chInfo">${T("Scegli una conversazione a sinistra.")}</div>
          <div class="flt"><input id="chMq" placeholder="${esc(T("Cerca nella conversazione"))}"><input id="chWho" placeholder="${esc(T("Mittente"))}" style="max-width:180px"><label class="hint"><input type="checkbox" id="chAtt"> ${T("solo con allegati")}</label></div></div>
          <div class="hsplit" id="chTopSplit" title="${esc(T("Trascina in su o in giù; doppio clic: altezza predefinita; ▾/▸ comprime o riapre"))}"></div>
          <div class="msgs" id="chMsgs"></div></div></div>`;
      document.body.appendChild(ov);
      $("chClose").onclick = closeChats;
      if (window.hsplit){
        hsplit($("chFltSplit"), {key: "chatflt", el: () => $("chFlt"), min: 30, max: () => ov.querySelector(".chatleft").clientHeight * 0.7, label: () => T("Filtri compressi: clic per riaprirli")});
        hsplit($("chTopSplit"), {key: "chattop", el: () => $("chTop"), min: 30, max: () => ov.querySelector(".chatright").clientHeight * 0.7, label: () => T("Intestazione della conversazione compressa: clic per riaprirla")});
      }
      if (window.paneSplit) paneSplit($("chSplit"), {key: "chat", el: () => ov.querySelector(".chatleft"), dir: 1, min: 200, max: () => ov.querySelector(".chatwin").clientWidth * 0.6,
        set: w => { const cw = ov.querySelector(".chatwin"); w ? cw.style.setProperty("--chlw", w + "px") : cw.style.removeProperty("--chlw"); }});
      ov.onclick = e => { if (e.target === ov) closeChats(); };
      document.addEventListener("keydown", e => { if (e.key === "Escape" && chatOpen() && !AV && $("modal").classList.contains("hidden")) closeChats(); });
      let t1, t2;
      const relist = () => { clearTimeout(t1); t1 = setTimeout(loadThreads, 300); };
      $("chApp").onchange = relist; $("chQ").oninput = relist; $("chFrom").onchange = relist; $("chTo").onchange = relist;
      const reload = () => { clearTimeout(t2); t2 = setTimeout(() => { CS.q = $("chMq").value.trim(); CS.who = $("chWho").value.trim(); CS.att = $("chAtt").checked; loadMsgs(true); }, 300); };
      $("chMq").oninput = reload; $("chWho").oninput = reload; $("chAtt").onchange = reload;

    ov.classList.remove("hidden"); document.body.classList.add("chatopen");
    let tid = opts.thread;

    if (window.NAVR) NAVR();
  }
  async function loadThreads(){
    const q = {app: $("chApp").value, q: $("chQ").value.trim(), from: $("chFrom").value, to: $("chTo").value};
    const r = await api("/api/mobile/threads?" + new URLSearchParams(q)).catch(e => { toast(e.message, "bad"); return null; });
    if (!r) return;
    const sel = $("chApp"), keep = sel.value;
    sel.innerHTML = `<option value="">${T("Tutte le app")}</option>` + Object.entries(r.apps || {}).map(([k, n]) => `<option value="${esc(k)}">${esc(appLbl(k))} (${nf(n)})</option>`).join("");

    CS.threads = r.threads;
    $("chList").innerHTML = r.threads.length ? r.threads.map(t => `<div class="th ${CS.th && CS.th.id === t.id ? "on" : ""}" data-id="${t.id}">

        <div class="s">${fts(t.last)}</div></div>`).join("") : `<div class="empty" style="padding:14px">${T("Nessuna conversazione.")}</div>`;

  async function selectThread(id, opts){

    const pv = $("pv");
    if (!AV){
      AV = {list, i, home: {parent: pv.parentNode, next: pv.nextSibling}, saved: {it: pvState.it, sec: pvState.sec, tab: pvState.tab, open: !pv.classList.contains("hidden"), width: pv.style.width}};
      const o = document.createElement("div"); o.className = "attov"; o.id = "attOv";
      o.innerHTML = `<div class="attwin"><div class="atthead"><span class="navslot"></span><button class="btn small" id="avPrev" title="${esc(T("Allegato precedente (←)"))}">←</button><span id="avN" class="hint"></span><button class="btn small" id="avNext" title="${esc(T("Allegato successivo (→)"))}">→</button>
        <div class="grow" id="avCtx"></div><button class="btn small" id="avClose" title="${esc(T("Chiudi (Esc) e torna al messaggio nella chat"))}">✕</button></div><div class="attslot" id="avSlot"></div></div>`;
      document.body.appendChild(o);
      o.onclick = e => { if (e.target === o) attClose(); };
      $("avClose").onclick = () => attClose();
      $("avPrev").onclick = () => attStep(-1); $("avNext").onclick = () => attStep(1);
      // pulsanti del riquadro che portano altrove: prima si registra il passo (Indietro torna qui), poi si chiude
      o.addEventListener("click", e => {
        if (e.target.closest("#pvClose")){ e.preventDefault(); e.stopPropagation(); attClose(); return; }
        const b = e.target.closest("[data-pa]"); if (!b) return;
        if (["tree", "src", "ask", "chatth"].includes(b.dataset.pa)){ if (window.NAVP) NAVP(); NAVHOLD(); attClose(true); closeChats(); }
      }, true);
    }
    AV.list = list; AV.i = i;
    const a = list[i], ok = a.inode != null && a.inode !== "", slot = $("avSlot");
    $("avN").textContent = TF("{0} di {1}", i + 1, list.length);
    $("avPrev").disabled = i <= 0; $("avNext").disabled = i >= list.length - 1;
    $("avCtx").innerHTML = `<b>${esc(fts(a.ts))}</b> · ${a.dir === "out" ? T("inviato da questo dispositivo") : esc(a.sender_name || a.sender || T("ricevuto"))}${a.text ? ` · <span class="hint">«${esc(a.text.slice(0, 160))}»</span>` : ""}`;
    if (ok){
      if (pv.parentNode !== slot){ slot.innerHTML = ""; slot.appendChild(pv); }
      pv.classList.remove("hidden"); pv.style.width = "";
      const it = avItem(a);
      if (!pvState.it) pvState.it = it;              // il riquadro è già «aperto»: niente cambi alla disposizione della pagina
      pvOpen(it, resSec, tab || (pvState.tab === "hex" || pvState.tab === "meta" || pvState.tab === "text" ? pvState.tab : "view"));
      setTimeout(() => { const img = $("pvImg"); if (img){ img.title = T("Clic: ingrandisci / adatta"); } }, 50);
    } else {
      if (pv.parentNode === slot) avHomePv();
      const lm = isLeappMedia(a), src = lm ? "/api/mobile/leapp_media?" + new URLSearchParams({t: TOKEN, p: a.path}) : "";
      const lab = TF("allegato «{0}» del messaggio {1} ({2} UTC) nella conversazione «{3}» — {4}", a.name || "", a.mid, (a.ts || "").replace("T", " "), (CS.th || {}).title || "", a.device_path || "");
      const tsrc = !lm && a.thumb ? attThumb(a) : "";
      slot.innerHTML = `<div class="avalt">${lm && IMG_RX.test(a.path) ? `<div class="pvimg fit" id="avImg"><img src="${src}" alt=""></div>` : lm && VID_RX.test(a.path) ? `<video controls preload="metadata" src="${src}"></video>` : lm && AUD_RX.test(a.path) ? `<audio controls src="${src}"></audio>`
          : tsrc ? `<div class="pvimg fit" id="avImg"><img src="${tsrc}" alt=""></div><div class="cwarn" style="margin-top:6px"><b>${T("miniatura dal database – file non presente nell'estrazione")}</b></div>` : `<div class="resempty">${T("File non presente nell'estrazione: si conosce solo il riferimento.")}</div>`}
        <div class="hint" style="margin-top:8px">${lm ? TF("Copia fatta da {0} nel suo rapporto (copia di lavoro, non l'originale dell'estrazione).", esc(leappTool())) : ""} ${[a.device_path || a.name ? `<span class="mono">${esc(a.device_path || a.name)}</span>` : "", a.sha256 ? `SHA-256 ${esc(a.sha256)}` : ""].filter(Boolean).join(" · ")}</div>
        <div style="margin-top:8px"><button class="btn small" id="avFind">📌 ${T("Reperto")}</button> <button class="btn small" id="avAsk">${T("Chiedi all'agente")}</button></div></div>`;
      const im = $("avImg"); if (im) im.onclick = () => im.classList.toggle("fit");
      $("avFind").onclick = () => findingForm({label: lab});
      $("avAsk").onclick = () => { if (window.NAVP) NAVP(); attClose(true); closeChats(); askAbout({label: lab}); };
    }
    if (window.NAVR) NAVR();
  }
  function attStep(d){ if (AV && AV.list[AV.i + d]) attShow(AV.list, AV.i + d); }
  function avHomePv(){
    const pv = $("pv"), h = AV.home;
    h.parent.insertBefore(pv, h.next && h.next.parentNode === h.parent ? h.next : null);
    pv.style.width = AV.saved.width;
  }
  function attClose(silent){
    if (!AV) return;
    const mid = (AV.list[AV.i] || {}).mid, sv = AV.saved, pv = $("pv");
    if (pv.parentNode === $("avSlot")) avHomePv();
    const o = $("attOv"); if (o) o.remove();
    AV = null;
    // il riquadro torna com'era prima dell'anteprima (aperto sul file di prima o chiuso)
    if (sv.open && sv.it){ pvState.it = sv.it; pvOpen(sv.it, sv.sec, sv.tab); }
    else { pv.classList.add("hidden"); pvState.it = null; hexState = null; $("pvBody").innerHTML = ""; }
    if (!silent && mid != null){
      const el = $("chMsgs") && $("chMsgs").querySelector(`.bub[data-mid="${mid}"]`);
      if (el){ $("chMsgs").querySelectorAll(".bub.focus").forEach(x => x.classList.remove("focus")); el.classList.add("focus"); el.scrollIntoView({block: "nearest"}); }
    }
    if (window.NAVR) NAVR();
  }
  window.addEventListener("keydown", e => {
    if (!AV || !$("modal").classList.contains("hidden")) return;
    if (e.target.closest && e.target.closest("input,textarea,select")) return;
    if (e.key === "Escape"){ e.preventDefault(); e.stopImmediatePropagation(); attClose(); return; }
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !(e.altKey || e.metaKey) && !(pvState.tab === "hex" && hexState && hexState.focus)){
      e.preventDefault(); e.stopImmediatePropagation(); attStep(e.key === "ArrowLeft" ? -1 : 1);
    }
  }, true);
  // stato per la navigazione Indietro/Avanti della pagina
  function navState(){
    if (!chatOpen()) return null;
    const box = $("chMsgs"), top = box ? box.scrollTop : 0;
    let vis = null;
    if (box) for (const b of box.querySelectorAll(".bub")){ if (b.offsetTop + b.offsetHeight > top){ vis = +b.dataset.mid; break; } }
    const fe = box && box.querySelector(".bub.focus");
    return {thread: CS.th ? CS.th.id : null, title: CS.th ? CS.th.title : null, app: CS.th ? CS.th.app : null, scroll: top, mid: fe ? +fe.dataset.mid : vis, hl: !!fe,
      f: {app: $("chApp").value, q: $("chQ").value, from: $("chFrom").value, to: $("chTo").value, mq: $("chMq").value, who: $("chWho").value, att: $("chAtt").checked},
      att: AV ? {mid: AV.list[AV.i].mid, k: AV.i - AV.list.findIndex(x => x.mid === AV.list[AV.i].mid), name: AV.list[AV.i].name, tab: pvState.tab} : null};
  }
  async function navRestore(st){
    if (!st){ if (AV) attClose(true); if (chatOpen()) closeChats(); return; }
    if (AV && !st.att) attClose(true);
    if (chatOpen() && CS.th && CS.th.id === st.thread && JSON.stringify(st.f) === JSON.stringify(navState().f)){
      if (st.att) await attShowFor(st.att.mid, st.att.k, st.att.tab, true); else $("chMsgs").scrollTop = st.scroll;
      return;
    }
    await openChats({f: st.f});
    if (st.thread) await selectThread(st.thread, {f: st.f, mid: st.mid, quiet: !st.hl, scroll: st.scroll, att: st.att});
  }
  function crumbs(){
    const st = navState(); if (!st) return [];
    const out = [{label: "💬 " + T("Chat"), go: () => { if (AV) attClose(true); $("chApp").value = ""; CS.th = null; loadThreads(); $("chInfo").textContent = T("Scegli una conversazione a sinistra."); $("chMsgs").innerHTML = ""; }}];
    if (st.thread){
      out.push({label: appLbl(st.app), go: () => { if (AV) attClose(true); $("chApp").value = st.app; loadThreads(); }});
      out.push({label: st.title, go: () => { if (AV) attClose(); }});
    }
    if (st.att) out.push({label: "📎 " + (st.att.name || T("allegato"))});
    return out;
  }
  // fuso: per un telefono serve solo alle date DOS degli zip (tutte le altre sono UTC)
  const fusoRowDisk = fusoRow;
  fusoRow = c => {
    if (c.tipo_caso !== "smartphone") return fusoRowDisk(c);
    const f = c.fuso_dispositivo || {}, det = f.rilevato || {};
    const lbl = `<b title="${esc(T("Fuso del telefono: serve solo per le date DOS delle voci dello zip, che non hanno fuso; tutte le altre date sono UTC"))}">${T("Fuso del telefono")}</b>`;
    const nota = f.stato === "rilevato" || f.stato === "confermato" ? `<div class="hint" style="margin-top:3px">${TF("Letto nell'estrazione ({0}).", esc(det.origine || ""))}</div>`
      : f.stato === "discordante" ? `<div style="color:#b45309;margin-top:3px">${TF("<b>Attenzione:</b> nel telefono il fuso è <b>{0}</b>, diverso da quello scelto.", esc(det.tz || ""))}</div>`
      : `<div style="color:#b45309;margin-top:3px">${T("<b>Non verificabile:</b> il fuso non è stato trovato nell'estrazione. Conta solo per le eventuali date DOS dello zip; le altre date sono UTC.")}</div>`;
    return lbl + `<span>${esc(f.tz || "")} <span class="hint">(${esc(f.origine || "")})</span>${nota}</span>`;
  };
  // ------------------------------------------------------------------ artefatti: sottovoci dell'albero e celle
  const isPhone = () => (caseInfo || {}).tipo_caso === "smartphone";
  const rtNodesDisk = rtNodes;
  rtNodes = () => {
    const nodes = rtNodesDisk(), sub = (RT || {}).artsub;
    if (!isPhone() || !sub || !sub.length) return nodes;
    const art = nodes.find(n => n.id === "art"); if (!art) return nodes;
    const f = (id, label, filt, count, kids) => ({id, label, sec: "art", filt, count, kids: kids || []});
    const by = new Map();
    for (const [cat, g, s, n] of sub){
      const k = cat + "\u0001" + g;
      if (!by.has(k)) by.set(k, {cat, g, n: 0, subs: []});
      const e = by.get(k); e.n += n; if (s != null) e.subs.push([s, n]);
    }
    art.kids.forEach(nd => {
      const cat = nd.filt && nd.filt.cat, groups = [...by.values()].filter(e => e.cat === cat);
      if (groups.length) nd.kids = groups.map(e => f(`art:${cat}:${e.g}`, grpLbl(cat, e.g), {cat, grp: e.g}, e.n,
        e.subs.map(([s, n]) => f(`art:${cat}:${e.g}:${s}`, s, {cat, grp: e.g, sub: s}, n))));
    });
    return nodes;
  };
  // (2.20) Foto/Video/Audio: file allegati alle chat (in tutto e per app); filtro «Origine»
  const metaFlt = apps => META_FLT_DISK.concat([["orig", "select", T("Origine"), [["", T("Tutte")], ["*", T("Allegati delle chat")], ...apps.map(k => [k, appLbl(k)])]]]);
  const rtNodesArt = rtNodes;
  rtNodes = () => {
    const nodes = rtNodesArt(), cm = (RT || {}).chatmedia;
    if (!isPhone() || !cm || !cm.n) return nodes;
    const meta = nodes.find(n => n.id === "meta"); if (!meta) return nodes;
    FILTERS.meta = metaFlt([...new Set([...Object.keys(((caseInfo || {}).chat || {}).app || {}), ...cm.app.map(x => x[0])])]);
    meta.kids.push({id: "meta:chat", label: T("💬 Dalle chat"), sec: "meta", filt: {orig: "*"}, count: cm.n,
      kids: cm.app.map(([a, n]) => ({id: "meta:chat:" + a, label: appLbl(a), sec: "meta", filt: {orig: a}, count: n, kids: []}))});
    // (2.20) anche sotto Foto, Video e Audio: gli allegati delle chat di quel tipo, per app
    for (const [k, flt] of [["foto", {foto: true}], ["vid", {vid: true}], ["aud", {aud: true}]]){
      const nd = meta.kids.find(n => n.id === "meta:" + k), c = cm[k];
      if (!nd || !c || !c.n) continue;
      nd.kids = [{id: `meta:${k}:chat`, label: T("💬 Dalle chat"), sec: "meta", filt: {...flt, orig: "*"}, count: c.n,
        kids: c.app.map(([a, n]) => ({id: `meta:${k}:chat:${a}`, label: appLbl(a), sec: "meta", filt: {...flt, orig: a}, count: n, kids: []}))}];
    }
    return nodes;
  };
  // (2.20) anteprima di un file dell'estrazione: riquadro «Origine» se il file è allegato a messaggi delle chat
  const pvRenderViewDisk = pvRenderView;
  pvRenderView = (v, it) => {
    const r = pvRenderViewDisk(v, it);
    if (isPhone() && v && v.source === "fs" && v.inode != null && v.inode !== "") originBlock(v, it);
    return r;
  };
  async function originBlock(v, it){
    let o;
    try{ o = (await api("/api/mobile/origine?" + new URLSearchParams({part: v.part, inode: v.inode}))).origine; }catch(e){ return; }
    if (!o.length || pvState.it !== it || pvState.tab !== "view" || !$("pvBody")) return;
    const box = document.createElement("div"); box.className = "porig";
    box.innerHTML = `<div><b>💬 ${T("Origine")}</b>: ${o.length === 1 ? T("allegato di un messaggio delle chat") : TF("allegato di {0} messaggi delle chat", o.length)}</div>` +
      o.map(x => `<div class="porow"><div class="crow"><span>${VICO[x.dir] || ""} <b>${esc(appLbl(x.app))}</b> · «${esc(x.title || "")}» · ${x.dir === "out" ? T("inviato") : x.dir === "in" ? TF("ricevuto da {0}", esc(x.who || "?")) : T("verso non indicato")} · ${fts(x.ts)}</span><span class="grow"></span>
        <button class="btn small" data-om="${x.mid}">💬 ${T("Apri nella chat")}</button></div>
        <div class="hint">${x.livello === "certo" ? "✅" : "⚠️"} ${esc(x.livello_lbl)} (${esc(x.metodo_lbl)})${x.verifica === "uguale" ? " · " + esc(T("SHA-256 uguale a quello registrato dall'app")) : x.verifica === "diverso" ? " · " + esc(T("ATTENZIONE: SHA-256 diverso da quello registrato dall'app")) : ""}</div>
        <div class="hint mono" style="font-size:11px">${T("Fonte:")} ${x.leapp ? esc(leappTool()) + " · " : ""}${esc(x.db || "")}${x.tabella ? " · " + esc(TF("tabella {0}, riga {1}", x.tabella, x.riga)) : ""}</div></div>`).join("");
    $("pvBody").prepend(box);
    box.querySelectorAll("[data-om]").forEach(b => b.onclick = () => openChats({mid: +b.dataset.om}));
  }
  const CALL_LBL = {telefono: T("Telefono"), facetime: "FaceTime"};
  const grpLbl = (cat, g) => cat === "messaggi" ? appLbl(g) : cat === "chiamate" ? (CALL_LBL[g] || g) : g;
  const VERSO = {out: T("in uscita"), in: T("in arrivo"), persa: T("persa"), rifiutata: T("rifiutata"), segreteria: T("segreteria")};
  const VICO = {out: "↗", in: "↙", persa: "✖", rifiutata: "⛔", segreteria: "📼"};
  const hms = s => { if (s == null) return ""; s = Math.round(s); return [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(x => String(x).padStart(2, "0")).join(":"); };
  const artTitleDisk = artTitle, artDetailDisk = artDetail;
  artTitle = x => {
    const d = x.data || {};
    if (x.cat === "messaggi" && d.chat_thread){
      const loc = (d.locale || {}).id, al = d.altro || {}, g = d.gruppo;
      const me = `📱 ${T("questo dispositivo")}${loc ? ` <span class="mono">${esc(loc)}</span>` : ""}`;
      const other = g ? `👥 <b>${esc(g.nome || "")}</b> <span class="hint">${TF("{0} partecipanti", nf(g.n))}</span>`
        : `👤 <b>${esc(al.nome || al.id || T("(sconosciuto)"))}</b>${al.nome && al.id ? ` <span class="mono">${esc(al.id)}</span>` : ""}${al.breve ? ` <span class="hint">· ${T("numero breve/servizio")}</span>` : ""}`;
      return `<div>${me} ↔ ${other}</div><div class="hint">${esc(appLbl(d.app))} · ${d.n === 1 ? T("1 messaggio") : TF("{0} messaggi", nf(d.n))}${d.fonte ? ` · ${esc(TF("da {0}", d.fonte.strumento || leappTool()))}` : ""}</div>`;
    }
    if (x.cat === "chiamate" && d.chiamata){
      const who = d.nome_rubrica || d.nome_app;
      return `<div><span title="${esc(VERSO[d.verso] || T("verso non indicato"))}">${VICO[d.verso] || "☎"}</span> <b>${esc(who || d.numero || T("(non indicato)"))}</b>${who && d.numero ? ` <span class="mono">${esc(d.numero)}</span>` : ""}</div><div class="hint">${esc(CALL_LBL[d.app] || d.app_lbl || d.app)} · ${esc(VERSO[d.verso] || T("verso non indicato"))}${d.nome_rubrica && d.nome_app && d.nome_app !== d.nome_rubrica ? " · " + esc(d.nome_app) : ""}</div>`;
    }
    if (x.cat === "leapp" && d.artefatto) return `<b>${esc(x.title)}</b><div class="hint">${esc(d.categoria || "")} · ${esc(d.leapp || "")}</div>`;
    return artTitleDisk(x);
  };
  const KV_MAX = 14;
  // a capo solo tra le parole; i token lunghi senza spazi (URL, hash, identificativi) si possono spezzare ovunque
  const wrapLong = v => String(v).split(/(\s+)/).map(w => w.length > 24 ? `<span class="lt">${esc(w)}</span>` : esc(w)).join("");
  artDetail = x => {
    const d = x.data || {};
    if (x.cat === "messaggi" && d.chat_thread){
      const lm = d.ultimo_msg;
      return `<div>${fts(d.primo)} → ${fts(d.ultimo)}</div><div>${TF("inviati {0} · ricevuti {1}", nf(d.inviati), nf(d.ricevuti))}${d.senza_verso ? " · " + TF("verso non indicato {0}", nf(d.senza_verso)) : ""}${d.eventi ? " · " + TF("eventi {0}", nf(d.eventi)) : ""} · ${TF("allegati {0}", nf(d.allegati))}${d.eliminati ? " · " + TF("eliminati {0}", nf(d.eliminati)) : ""}</div>` +
        (lm ? `<div class="hint">${lm.dir === "out" ? T("Ultimo (inviato):") : lm.dir === "sys" ? T("Ultimo (evento):") : T("Ultimo (ricevuto):")} ${esc((lm.testo || "[" + (lm.tipo || KIND[lm.kind] || lm.kind || "") + "]").slice(0, 160))}</div>` : "");
    }
    if (x.cat === "chiamate" && d.chiamata){
      const fonti = {}; (d.fonti || []).forEach(f => { const k = f.strumento + " «" + f.artefatto + "»"; fonti[k] = (fonti[k] || 0) + 1; });
      return `<div class="artkv"><div><span class="k">${T("durata")}</span><span class="v">${d.durata_s != null ? hms(d.durata_s) : "—"}</span>${d.risposta != null ? ` <span class="k">${T("risposta")}</span><span class="v">${d.risposta ? T("sì") : T("no")}</span>` : ""}</div>` +
        (d.tipo || d.esito ? `<div><span class="v">${esc([d.tipo, d.esito].filter(Boolean).join(" · "))}</span></div>` : "") +
        `<div><span class="k">${TF("fonti ({0})", (d.fonti || []).length)}</span><span class="v">${esc(Object.entries(fonti).map(([k, n]) => k + (n > 1 ? " ×" + n : "")).join(", "))}</span></div>` +
        (d.discordanze ? `<div class="hint">⚠ ${T("valori diversi tra le fonti: vedi Dettagli")}</div>` : "") + (d.nota ? `<div class="hint">${esc(d.nota)}</div>` : "") +
`</div>`;
    }
    if (x.cat === "leapp" && d.campi){
      const dates = new Set(d.date || []), ent = Object.entries(d.campi);
      return `<div class="artkv">${ent.slice(0, KV_MAX).map(([k, v]) => { v = String(v); return `<div><span class="k">${esc(k)}</span><span class="v">${dates.has(k) ? esc(fts(v)) : wrapLong(v.length > 300 ? v.slice(0, 300) + "…" : v)}</span></div>`; }).join("")}</div>` +
        (ent.length > KV_MAX ? `<div class="hint">${TF("… altri {0} campi in «Dettagli»", ent.length - KV_MAX)}</div>` : "");
    }
    return artDetailDisk(x);
  };
  const baseActionsDisk = baseActions, rowActionDisk = rowAction;
  baseActions = (kind, x) => {
    const a = baseActionsDisk(kind, x);
    if (kind === "art" && x.cat === "messaggi" && (x.data || {}).chat_thread) a.unshift(["chat", "💬", T("Apri chat")]);
    if (kind === "meta" && x.chat_mid) a.unshift(["mchat", "💬", TF("Apri nella chat ({0})", x.chat)]);
    return a;
  };
  // pannello dei dettagli di una conversazione: «💬 Apri chat» accanto a Fonte, Reperto, Chiedi, Preferiti
  const extRefDisk = extRef;
  extRef = (kind, x) => { const r = extRefDisk(kind, x); if (r && kind === "art" && x.cat === "messaggi" && (x.data || {}).chat_thread) r.chat = x.data.chat_thread; return r; };
  rowAction = (kind, a, x, i) => a === "chat" ? openChats({thread: x.data.chat_thread}) : a === "mchat" ? openChats({mid: x.chat_mid}) : rowActionDisk(kind, a, x, i);
  ART_LBL.leapp = T("Artefatti iLEAPP/ALEAPP (smartphone)");
  ART_LBL.chiamate = T("Chiamate");
  const MSG_DISK = ART_LBL.messaggi, ART_CAT_DISK = FILTERS.art[0][3], META_FLT_DISK = FILTERS.meta;
  window.RM = {mode: false, home: () => { $("mobPath").focus(); }, caseRendered, openChats, closeChats, chatOpen, navState, navRestore, crumbs,
               appLbl, grpLbl, attOpen: () => !!AV, pvSaved: () => AV ? AV.saved : null};
})();
</script>
